connection:
  transport: tcp
  address: 127.0.0.1:502
  unit_id: 1
  timeout: 5s
  idle_timeout: 1m

rtu:
  baud_rate: 19200
  data_bits: 8
  stop_bits: 1
  parity: E

output:
  format: table

points:
  - name: breaker_closed
    kind: coil
    address: 0
    quantity: 1
    writable: true
  - name: active_power
    kind: holding-register
    address: 0
    quantity: 2
    type: float32
    byte_order: big
    word_order: high-low
    unit: kW
    scale: 1
    offset: 0
    writable: false

default_profile: local
profiles:
  local:
    connection:
      transport: tcp
      address: 127.0.0.1:502
      unit_id: 1
  serial:
    connection:
      transport: rtu
      address: /dev/ttyUSB0
      unit_id: 1
    rtu:
      baud_rate: 19200
      data_bits: 8
      stop_bits: 1
      parity: E
    points:
      - name: active_power
        kind: holding-register
        address: 100
        quantity: 2
        type: float32
        unit: kW
