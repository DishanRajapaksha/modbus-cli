name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/align-cli-contracts
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Apply contract review fixes
        run: python3 scripts/fix-cli-contract-review.py
      - name: Format
        run: gofmt -w internal/output/output.go internal/cli/app.go internal/cli/render.go internal/cli/commands.go internal/cli/output_contracts_test.go
      - name: Test
        run: go test ./...
      - name: Build
        run: make build
      - name: Commit verified source changes
        run: |
          rm -rf bin
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            internal/output/output.go \
            internal/cli/app.go \
            internal/cli/render.go \
            internal/cli/commands.go \
            internal/cli/output_contracts_test.go
          git commit -m "Fix stream and output exit contracts"
          git push origin HEAD:agent/align-cli-contracts
